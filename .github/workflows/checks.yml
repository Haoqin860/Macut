name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Core and image regression checks
        run: ./Scripts/run-checks.sh
      - name: Build native app
        run: ./Scripts/build-app.sh
      - name: Audit tracked files and app payload
        run: python3 Scripts/privacy-audit.py --tracked --app build/Macut.app
